[project]
name = "ingestion-service"
version = "0.1.0"
description = "Document ingestion service for AarhusAi — Haystack v2 pipeline (extract → chunk → embed → store)"
license = "MPL-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,!=0.136.3",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "haystack-ai>=2.10.0",
    # Capped to the tested major: qdrant-haystack renamed QdrantDocumentStore's
    # public `.client` to a private `_client` between 8.x and 10.x, which
    # silently broke our raw-client helpers (indexing.py). Floor at the version
    # we run + test against; cap the major so the next breaking rename can't slip
    # in on an unpinned rebuild (mirrors the qdrant-client `<3.0` cap below).
    "qdrant-haystack>=10.3.0,<11.0.0",
    "fastembed-haystack>=1.5.0",
    "pypdf>=6.21.2",                   # PyPDFToDocument optional dep
    "qdrant-client>=1.12.0,<3.0",
    "spacy>=3.8.18,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "zh-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    # Token-aware chunking: HuggingFace tokenizers + langchain's recursive
    # splitter give chunk boundaries that respect the embedding model's
    # context window (e5-large 512, bge-m3 8k, etc.).
    "transformers>=4.40",
    "langchain-text-splitters>=0.3",
    # vision-llm engine: render PDF pages to images locally. pypdfium2 bundles
    # its own pdfium (no system poppler/libreoffice); office->PDF is delegated
    # to the Gotenberg sidecar over httpx. Pillow encodes the rendered pages.
    "pypdfium2>=4.0",
    "pillow>=10.0",
    # Observability: Prometheus client for the /metrics scrape endpoint and the
    # in-process counters/histograms (ingest outcomes, per-stage latency,
    # routing decisions). Single well-established lib; no scraper code here.
    "prometheus-client>=0.20",
    "defusedxml>=0.7.1,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.0",
    "moto[s3]>=5.0",
    "respx>=0.21.0",
    # Optional developer security checks: pip-audit and bandit.
    "pip-audit>=2.7",
    "bandit>=1.7",
    "basedpyright>=1.31",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Pillow 13 fixes known vulnerabilities in 12.3.0. FastEmbed's current Pillow
# upper bound predates that release; keep this temporary override covered by
# native BM42/reranker and image regression checks, and remove it once upstream
# supports the secure release directly.
override-dependencies = ["pillow>=13.0.0,<14"]
constraint-dependencies = ["certifi>=2026.10.19", "filelock>=4.2.1"]

[tool.ruff]
target-version = "py311"
line-length = 99
exclude = ["build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # Allow Depends() in function defaults (FastAPI pattern)

[tool.ruff.lint.isort]
known-first-party = ["app"]

# Existing errors are recorded in .basedpyright/baseline.json; only new ones fail.
[tool.basedpyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
