[project]
name = "nexrag"
version = "1.0.0"
description = "NexRAG: local agentic RAG built upon Open WebUI and AarhusAI"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    # 2.60 修复 Anthropic 2.x 消息参数的联合类型兼容问题（上游 #11077）。
    "pydantic-ai-slim[openai,anthropic,google]>=2.60.0,<3.0",
    "cryptography>=44.0",
    "qdrant-client>=1.12.0",
    "sqlglot>=30.29.0",
    "pyyaml>=6.0.2",
    "PyJWT>=2.9.0",
    "httpx>=0.28.0",
    "mcp>=2.3.0,<3.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2,<4.0",
    "fastembed>=0.9.1,<1.0",
    "python-multipart>=0.0.33,<0.1",
    "defusedxml>=0.7.1,<1.0",
]

# uv sync 默认安装开发组，保证检查脚本使用 .venv 中的 pytest，不回退到全局命令。
[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "filelock==4.2.8",
    "pytest>=9.2.0,<10.0",
    "pytest-asyncio>=1.4.1.post1,<2.0",
    "ruff>=0.17.3,<0.18",
    "sqlalchemy==2.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "base",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# FastEmbed 0.9 仍限制 Pillow <13；Pillow 13 修复 2026 年 10 月的图片解码漏洞。
# 文本/BM42 与图片兼容性已分别验证；FastEmbed 正式允许 Pillow 13 后移除此覆盖。
[tool.uv]
override-dependencies = ["pillow>=13.0.0,<14"]
