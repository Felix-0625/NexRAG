name: NexRAG CI

on:
  workflow_call:
  pull_request:
    paths: &paths
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "base/ingestion-service/**"
      - "base/retrieval-agent/**"
      - "base/search-agent/**"
      - "patches/**"
      - "start.cmd"
      - "start.ps1"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/**"
      - "**/*.md"
      - "examples/**"
  push:
    branches:
      - main
      - develop
    paths: *paths

permissions:
  contents: read

jobs:
  lock:
    name: Lock file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - shell: bash
        run: |
          for project in . base/ingestion-service base/retrieval-agent base/search-agent; do
            uv lock --check --project "$project"
          done

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check-repository.py

  test:
    name: Native core and patched WebUI contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev --python 3.12
      - name: Prepare pinned WebUI source and verify patch chain
        shell: pwsh
        run: ./scripts/prepare-webui.ps1
      - run: uv run pytest -q --junitxml=.local-run/ci-core.xml
      - name: Confirm native Windows symlink coverage without fallback
        shell: pwsh
        run: |
          @'
          import xml.etree.ElementTree as ET
          cases = [case for case in ET.parse('.local-run/ci-core.xml').iter('testcase')
                   if case.get('classname', '').endswith('test_native_symlink_boundaries')]
          assert len(cases) == 7, 'Expected all seven native filesystem boundary cases'
          assert all(all(case.find(tag) is None for tag in ('failure', 'error', 'skipped'))
                     for case in cases), 'Native Windows symlink cases must pass, not skip'
          print('Windows native symlink boundaries: 7/7 passed; no skips or junction fallback')
          '@ | uv run python -

  webui:
    name: Patched browser components
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned WebUI source
        shell: pwsh
        run: ./scripts/prepare-webui.ps1
      - name: Install pinned browser dependencies without executable lifecycle hooks
        working-directory: webui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-webui.mjs
      - name: Build the patched browser interface
        working-directory: webui
        run: node --max-old-space-size=6144 node_modules/vite/bin/vite.js build

  rag-services:
    name: RAG service regression (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion-service, retrieval-agent, search-agent]
    defaults:
      run:
        working-directory: base/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --all-groups --python 3.12
      - run: uv run pytest -q

  npm-audit:
    name: Known npm vulnerabilities
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned WebUI source
        shell: pwsh
        run: ./scripts/prepare-webui.ps1
      - name: Reject critical and unreviewed high advisories
        run: node scripts/audit-webui.mjs

  dependency-audit:
    name: Known Python vulnerabilities (${{ matrix.scope }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [core, ingestion, retrieval, search, webui]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
      - shell: pwsh
        run: ./scripts/audit-dependencies.ps1 -Scope ${{ matrix.scope }}

  ready:
    name: Release readiness
    if: always()
    needs: [lock, lint, test, webui, rag-services, npm-audit, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Failed release gates: " + ", ".join(failed))
          print("All release gates passed")
          PY
