name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    name: Release gates
    if: github.event.deleted == false
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub Release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the tag and extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-repository.py --release-tag "$RELEASE_TAG" --notes-out release-notes.md
      - name: Create the source archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          git archive --format=zip --prefix="NexRAG-$RELEASE_TAG/" -o "release/NexRAG-$RELEASE_TAG-source.zip" HEAD
          cd release
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: NexRAG ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
