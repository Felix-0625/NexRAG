# Olist is a replaceable NexRAG business-source example.
# Every source query must expose __tenant_id; the adapter enforces the selected
# tenant on that column before any row enters the private analysis database.
type: sqlite
database_path: ../../data/sqlite/business.db
tenant_exists_sql: SELECT 1 FROM sellers WHERE seller_id = ?
views:
  seller_items:
    grain: order_item
    primary_key: [order_id, order_item_id]
    columns:
      order_id: TEXT
      order_item_id: INTEGER
      seller_id: TEXT
      product_id: TEXT
      shipping_limit_date: TEXT
      price_cents: INTEGER
      freight_value_cents: INTEGER
    source_sql: >-
      SELECT order_id, order_item_id, seller_id, product_id,
      shipping_limit_date, price_cents, freight_value_cents,
      seller_id AS __tenant_id FROM order_items
  seller_orders:
    grain: order
    primary_key: [order_id]
    columns:
      order_id: TEXT
      order_status: TEXT
      order_purchase_timestamp: TEXT
      order_delivered_customer_date: TEXT
      order_estimated_delivery_date: TEXT
      customer_city: TEXT
      customer_state: TEXT
    source_sql: >-
      SELECT DISTINCT o.order_id, o.order_status, o.order_purchase_timestamp,
      o.order_delivered_customer_date, o.order_estimated_delivery_date,
      c.customer_city, c.customer_state, i.seller_id AS __tenant_id
      FROM orders o JOIN customers c ON c.customer_id = o.customer_id
      JOIN order_items i ON i.order_id = o.order_id
  seller_products:
    grain: product
    primary_key: [product_id]
    columns:
      product_id: TEXT
      product_category_name: TEXT
      product_category_name_english: TEXT
      product_photos_qty: INTEGER
      product_weight_g: INTEGER
    source_sql: >-
      SELECT DISTINCT p.product_id, p.product_category_name,
      t.product_category_name_english, p.product_photos_qty,
      p.product_weight_g, i.seller_id AS __tenant_id
      FROM products p JOIN order_items i ON i.product_id = p.product_id
      LEFT JOIN product_category_name_translation t
      ON t.product_category_name = p.product_category_name
  seller_profile:
    grain: seller
    primary_key: [seller_id]
    columns:
      seller_id: TEXT
      seller_city: TEXT
      seller_state: TEXT
    source_sql: >-
      SELECT seller_id, seller_city, seller_state,
      seller_id AS __tenant_id FROM sellers
